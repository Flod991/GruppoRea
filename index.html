<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turni Gruppo Rea</title>
  <meta name="description" content="Gestione turni dei dipendenti per i punti vendita Decò e MD">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="icon" href="img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#283440">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Turni Rea">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-logo"><img id="brand-logo" src="img/logo.svg" alt="Gruppo Rea" width="78" height="49"></span>
      <div class="brand-title">Turni</div>
      <span id="sync-status" class="sync" aria-live="polite"></span>
    </div>
    <div class="pickers" id="pickers">
      <label class="picker">
        <span>Punto vendita</span>
        <select id="store-select"></select>
      </label>
      <label class="picker">
        <span>Reparto</span>
        <select id="dept-select"></select>
      </label>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sezioni">
    <button data-tab="plan">Turni</button>
    <button data-tab="summary">Riepilogo</button>
    <button data-tab="staff">Personale</button>
    <button data-tab="settings">Impostazioni</button>
  </nav>

  <main id="view" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
