<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turni Gruppo Rea</title>
  <meta name="description" content="Gestione turni dei dipendenti per i punti vendita Decò e MD">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c8102e'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">T</span>
      <div class="brand-title">Turni Gruppo Rea</div>
      <span id="sync-status" class="sync" aria-live="polite"></span>
    </div>
    <div class="pickers" id="pickers">
      <label class="picker">
        <span>Punto vendita</span>
        <select id="store-select"></select>
      </label>
      <label class="picker">
        <span>Reparto</span>
        <select id="dept-select"></select>
      </label>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sezioni">
    <button data-tab="plan">Turni</button>
    <button data-tab="summary">Riepilogo</button>
    <button data-tab="staff">Personale</button>
    <button data-tab="settings">Impostazioni</button>
  </nav>

  <main id="view" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
